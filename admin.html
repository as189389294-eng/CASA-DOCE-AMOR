<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Casa Doce Amor</title>
<style>
body{margin:0;background:#fff9f5;color:#3d2925;font-family:system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.box,.item{background:#fff;border:1px solid #eedbd5;border-radius:16px;padding:18px;margin:14px 0}.login{max-width:420px;margin:80px auto}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:5px}input,textarea{width:100%;padding:11px;border:1px solid #dcc8c1;border-radius:9px;box-sizing:border-box;font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:#c86f7c;color:white;font-weight:800;cursor:pointer;margin:4px}.danger{background:#7b4a45}.muted{color:#806a63}.item{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr auto;gap:9px;align-items:end}.item .full{grid-column:1/-1}.status{font-weight:800}.hide{display:none}.add{margin:8px 0 18px}@media(max-width:760px){.item{grid-template-columns:1fr 1fr}.item .full{grid-column:1/-1}.item button{grid-column:span 2}}
</style></head><body><div class="wrap">
<div id="login" class="box login"><h1>🔐 Painel</h1><p class="muted">Casa Doce Amor</p><div class="field"><label>Senha do administrador</label><input id="password" type="password"></div><button onclick="login()">Entrar</button><p id="msg" class="muted"></p></div>
<div id="panel" class="hide"><div class="top"><div><h1>🍰 Casa Doce Amor</h1><p class="muted">Gerencie produtos, preços e estoque.</p></div><button onclick="logout()">Sair</button></div>
<div class="box"><b>Como usar:</b> altere os campos e clique em salvar. O cardápio público consulta os dados online.</div>
<button class="add" onclick="add()">＋ Adicionar produto</button><div id="list"></div></div></div>
<script>
let products=[];
const $=id=>document.getElementById(id);
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:$("password").value})});if(r.ok){$("login").classList.add("hide");$("panel").classList.remove("hide");load()}else $("msg").textContent="Senha incorreta."}
async function load(){let r=await fetch("/api/products");products=await r.json();render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){$("list").innerHTML=products.map((p,i)=>`<div class="item">
<div><label>Nome</label><input value="${esc(p.name)}" id="n${i}"></div>
<div><label>Preço (R$)</label><input type="number" step="0.01" min="0" value="${p.price}" id="p${i}"></div>
<div><label>Estoque</label><input type="number" min="0" value="${p.stock}" id="s${i}"></div>
<div><label>Emoji</label><input value="${esc(p.emoji||"🎂")}" id="e${i}"></div>
<div><button onclick="save(${i})">Salvar</button><button class="danger" onclick="del(${i})">Excluir</button></div>
<div class="full"><label>Descrição</label><textarea id="d${i}" rows="2">${esc(p.description||"")}</textarea></div>
<div class="full"><label>URL da foto (opcional)</label><input value="${esc(p.image_url||"")}" id="i${i}" placeholder="https://..."></div>
</div>`).join("")}
async function save(i){let p=products[i];let body={name:$("n"+i).value,price:Number($("p"+i).value),stock:Number($("s"+i).value),emoji:$("e"+i).value,description:$("d"+i).value,image_url:$("i"+i).value};let r=await fetch("/api/products/"+p.id,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(body)});if(r.ok){await load();alert("Salvo!")}else alert("Erro ao salvar.")}
async function add(){let r=await fetch("/api/products",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:"Novo produto",price:0,stock:0,emoji:"🎂",description:"",image_url:""})});if(r.ok)load();else alert("Erro ao adicionar.")}
async function del(i){if(!confirm("Excluir este produto?"))return;let r=await fetch("/api/products/"+products[i].id,{method:"DELETE"});if(r.ok)load();else alert("Erro ao excluir.")}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
</script></body></html>
